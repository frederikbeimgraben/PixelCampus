# Security headers for the PixelCampus front end.
#
# The <meta http-equiv> policy in index.html is a fallback. A meta tag cannot
# express frame-ancestors and is applied only after the parser reaches it, so
# the authoritative policy has to come from the server. Include this file inside
# the server block that serves dist/PixelCampus/browser.
#
#   server {
#       ...
#       include /etc/nginx/snippets/pixelcampus-security-headers.conf;
#   }

# Content-Security-Policy
#
# style-src needs 'unsafe-inline': Angular injects component styles as inline
# <style> elements at run time. Removing it needs a per-response nonce fed to
# Angular through ngCspNonce, which in turn needs server-side rendering.
#
# img-src includes the API host because wiki images and server icons are served
# from there. connect-src is limited to the same host, so a script that did get
# injected has nowhere to send what it reads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.pixelcampus.space; media-src 'self'; font-src 'self'; connect-src 'self' https://api.pixelcampus.space; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;

# Refuse to be framed. Stops clickjacking, and covers browsers that predate
# frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Do not let the browser guess a content type that differs from what is sent.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin, not the full path, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site uses no camera, microphone or location; say so.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Two years of HTTPS-only. Enable once the certificate renewal is known good:
# a wrong value here locks visitors out of the domain for the whole max-age.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Hashed bundles may be cached indefinitely; index.html must not be, or visitors
# keep loading an old application against a new API.
location ~* \.(?:js|css|woff2?|png|webp|mp3|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Single-page application: unknown paths are routes, not missing files.
location / {
    try_files $uri $uri/ /index.html;
}
