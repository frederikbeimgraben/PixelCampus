# Server block body for the PixelCampus front end.
#
# Pages are rendered per request by the Node process built from src/server.ts;
# everything with a file behind it is served from disk here. Include this inside
# the server block whose root is the built browser/ directory, then add the
# upstreams, which are deployment-specific:
#
#   map $http_upgrade $connection_upgrade { default upgrade; "" close; }
#
#   server {
#       root /srv/pixelcampus/browser;
#       include /etc/nginx/snippets/pixelcampus-site.conf;
#
#       location @ssr {
#           proxy_pass http://127.0.0.1:4000;
#           # The renderer stamps this on the inline scripts and styles it
#           # writes, which the policy below admits by nonce.
#           proxy_set_header X-CSP-Nonce $request_id;
#       }
#
#       # ^~ so the caching regex below does not claim /api/minecraft/icon.png.
#       location ^~ /api/v1/ {
#           proxy_pass http://127.0.0.1:8080;
#           # /api/v1/live is a WebSocket.
#           proxy_http_version 1.1;
#           proxy_set_header Upgrade $http_upgrade;
#           proxy_set_header Connection $connection_upgrade;
#       }
#
#       location ^~ /api/minecraft/ { proxy_pass https://api.pixelcampus.space; }
#   }
#
# The NixOS module in flake.nix includes this file and adds those locations.
# Serving the APIs under /api on the site's own host is what lets the policy
# below stay same-origin; a separate api. host would have to be named in
# connect-src and img-src, and would need CORS.

# Content-Security-Policy
#
# Rendering writes inline scripts and Angular writes component styles as inline
# <style> elements, so neither script-src nor style-src can be 'self' alone. A
# nonce admits exactly the blocks this deployment produced, where 'unsafe-inline'
# would admit any injected one too.
#
# $request_id is nginx's per-request identifier, sixteen random bytes: unique
# per response, which is what a nonce has to be, and not derived from anything
# the client sends.
#
# style-src-attr is the exception. Angular's style bindings become style
# attributes in the rendered markup, and an attribute cannot carry a nonce.
# Naming style-src-attr separately confines the allowance to attributes, which
# cannot run script, and leaves <style> elements needing the nonce.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;

# Refuse to be framed. Stops clickjacking, and covers browsers that predate
# frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Do not let the browser guess a content type that differs from what is sent.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin, not the full path, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site uses no camera, microphone or location; say so.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Two years of HTTPS-only. Enable once the certificate renewal is known good:
# a wrong value here locks visitors out of the domain for the whole max-age.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Bundle and asset names are hashed, so a year is safe.
#
# Set with expires rather than add_header: a location that adds a header of its
# own drops every header inherited from the server block, which would leave the
# bundles with no CSP and no nosniff. The cost is `immutable`, which expires
# cannot emit.
#
# Rendered pages are not cached at all, and say so themselves: they carry a
# nonce, which may be used once.
location ~* \.(?:js|css|woff2?|png|webp|mp3|ico)$ {
    expires 1y;
}

# Anything without a file behind it is a page, and pages are rendered.
location / {
    try_files $uri @ssr;
}
