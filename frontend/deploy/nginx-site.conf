# Server block body for the PixelCampus front end.
#
# Include it inside the server block that serves the built site, then add the
# two API proxies, which need deployment-specific upstreams:
#
#   map $http_upgrade $connection_upgrade { default upgrade; "" close; }
#
#   server {
#       root /srv/pixelcampus;
#       include /etc/nginx/snippets/pixelcampus-site.conf;
#
#       # ^~ so the caching regex below does not claim /api/minecraft/icon.png.
#       location ^~ /api/v1/ {
#           proxy_pass http://127.0.0.1:8080;
#           # /api/v1/live is a WebSocket.
#           proxy_http_version 1.1;
#           proxy_set_header Upgrade $http_upgrade;
#           proxy_set_header Connection $connection_upgrade;
#       }
#
#       location ^~ /api/minecraft/ { proxy_pass https://api.pixelcampus.space; }
#   }
#
# The NixOS module in flake.nix includes this file and adds those two locations.
# Serving the APIs under /api on the site's own host is what lets the policy
# below stay same-origin; a separate api. host would have to be named in
# connect-src and img-src, and would need CORS.
#
# The <meta http-equiv> policy in index.html is a fallback. A meta tag cannot
# express frame-ancestors and is applied only after the parser reaches it, so
# the authoritative policy has to come from the server.

# Content-Security-Policy
#
# style-src needs 'unsafe-inline': Angular injects component styles as inline
# <style> elements at run time. Removing it needs a per-response nonce fed to
# Angular through ngCspNonce, which in turn needs server-side rendering.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;

# Refuse to be framed. Stops clickjacking, and covers browsers that predate
# frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Do not let the browser guess a content type that differs from what is sent.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin, not the full path, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site uses no camera, microphone or location; say so.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Two years of HTTPS-only. Enable once the certificate renewal is known good:
# a wrong value here locks visitors out of the domain for the whole max-age.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Hashed bundles may be cached indefinitely; index.html must not be, or visitors
# keep loading an old application against a new API.
#
# Set with expires rather than add_header: a location that adds a header of its
# own drops every header inherited from the server block, which would leave the
# bundles with no CSP and no nosniff. The cost is `immutable`, which expires
# cannot emit.
location ~* \.(?:js|css|woff2?|png|webp|mp3|ico)$ {
    expires 1y;
}

location = /index.html {
    expires -1;
}

# Single-page application: unknown paths are routes, not missing files.
location / {
    try_files $uri $uri/ /index.html;
}
