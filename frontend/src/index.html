<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PixelCampus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PixelCampus - the Minecraft server of the Reutlingen University computer science faculty."
    />
    <meta name="theme-color" content="#3e3e3e" />

    <!--
      No <meta http-equiv="Content-Security-Policy"> here. The policy is now
      nonce-based, and a nonce is minted per request, which a tag baked into the
      bundle cannot carry. deploy/nginx-site.conf holds the policy; a meta tag
      could never express frame-ancestors anyway.
    -->

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!--
      The four Minecraft faces are needed by the first paint. Self-hosted, so no
      third-party font CDN and no personal data leaves the browser (GDPR).
    -->
    <link
      rel="preload"
      href="/assets/fonts/1_MinecraftRegular1.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/3_MinecraftBold1.woff"
      as="font"
      type="font/woff"
      crossorigin
    />

    <!--
      Only the page background is needed by the first frame. Panel sprites are
      prefetched from an idle callback instead; preloading them here made the
      browser warn about a preload it did not use.
    -->
    <link rel="preload" href="/assets/background/background-180.png" as="image" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
