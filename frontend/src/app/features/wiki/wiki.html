<div class="wiki">
  <app-side-navigator
    [pages]="entries()"
    [isMobile]="isMobile()"
    [index]="index()"
    (indexChange)="onIndexChange($event)"
    (expandedChange)="navExpanded.set($event)"
  ></app-side-navigator>

  <app-wiki-page [title]="title()" [navExpanded]="navExpanded()" [isMobile]="isMobile()">
    @if (loading()) {
      <!-- The old version rendered an empty frame until every page had loaded. -->
      <p class="wiki-status">Loading the wiki...</p>
    } @else {
      <app-wiki-content-items [items]="content()"></app-wiki-content-items>
    }
  </app-wiki-page>
</div>
