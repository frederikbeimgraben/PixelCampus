<!--
  The empty container is drawn under every icon, as the HUD does, so a missing
  half-heart still leaves its outline behind.
-->
@if (hasHealth()) {
  <div class="bar" role="img" [attr.aria-label]="label() + ' ' + healthLabel()">
    @for (state of hearts(); track $index) {
      <span class="icon">
        <img class="slot-bg" src="/assets/hud/heart_container.png" alt="" />
        @if (state !== 'empty') {
          <img class="fill" [src]="'/assets/hud/heart_' + state + '.png'" alt="" />
        }
      </span>
    }
  </div>
}

@if (hasHunger()) {
  <div class="bar" role="img" [attr.aria-label]="hungerAriaLabel() + ' ' + hungerLabel()">
    @for (state of food(); track $index) {
      <span class="icon">
        <img class="slot-bg" src="/assets/hud/food_empty.png" alt="" />
        @if (state !== 'empty') {
          <img class="fill" [src]="'/assets/hud/food_' + state + '.png'" alt="" />
        }
      </span>
    }
  </div>
}

@if (hasExperience()) {
  <div class="experience" role="img" [attr.aria-label]="experienceAriaLabel()">
    <img class="orb" src="/assets/hud/experience_orb.png" alt="" />
    <span class="xp-value">{{ progressPercent() }}%</span>
  </div>
}
