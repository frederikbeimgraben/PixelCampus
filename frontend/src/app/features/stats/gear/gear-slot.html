<app-minecraft-tooltip-wrapper [content]="tooltipLines()">
  <div
    class="slot"
    [class.empty]="item() === null"
    tabindex="0"
    [attr.aria-label]="tooltipLines().join(', ')"
  >
    @if (item(); as gear) {
      @if (showFallback()) {
        <!-- Entity-drawn items such as shields have no icon in the item set. -->
        <span class="fallback">{{ fallbackLabel() }}</span>
      } @else {
        <img
          class="texture"
          [src]="textureUrl()"
          alt=""
          width="32"
          height="32"
          loading="lazy"
          decoding="async"
          (error)="onTextureError()"
        />
      }

      @if (gear.amount > 1) {
        <span class="amount">{{ gear.amount }}</span>
      }

      @if (durabilityPercent() !== null) {
        <span class="durability">
          <span
            class="durability-fill"
            [style.width.%]="durabilityPercent()"
            [style.background-color]="durabilityColor()"
          ></span>
        </span>
      }
    } @else if (emptyUrl(); as silhouette) {
      <!-- The greyed shape vanilla draws in an empty equipment slot. -->
      <img class="silhouette" [src]="silhouette" alt="" width="32" height="32" />
    }
  </div>
</app-minecraft-tooltip-wrapper>
