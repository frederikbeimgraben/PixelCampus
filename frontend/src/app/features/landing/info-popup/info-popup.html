<div class="popup" *transloco="let t">
  <div class="content">
    <app-minecraft-popup class="app-popup">
      <div class="text">
        <h1>{{ t('connect.title') }}</h1>

        <section class="edition">
          <h2>{{ t('connect.java') }}</h2>
          <dl>
            <dt>{{ t('connect.address') }}</dt>
            <dd>
              <button
                type="button"
                class="copy"
                [class.copied]="javaHost.copied()"
                (click)="javaHost.copy()"
                [attr.aria-label]="t('connect.copyAddress')"
              >
                {{ javaHost.value }}{{ javaHost.copied() ? ' (' + t('connect.copied') + ')' : '' }}
              </button>
            </dd>
          </dl>
        </section>

        <section class="edition">
          <h2>{{ t('connect.bedrock') }}</h2>
          <dl>
            <dt>{{ t('connect.address') }}</dt>
            <dd>
              <button
                type="button"
                class="copy"
                [class.copied]="bedrockHost.copied()"
                (click)="bedrockHost.copy()"
                [attr.aria-label]="t('connect.copyBedrockAddress')"
              >
                {{ bedrockHost.value
                }}{{ bedrockHost.copied() ? ' (' + t('connect.copied') + ')' : '' }}
              </button>
            </dd>
            <dt>{{ t('connect.port') }}</dt>
            <dd>
              <button
                type="button"
                class="copy"
                [class.copied]="port.copied()"
                (click)="port.copy()"
                [attr.aria-label]="t('connect.copyPort')"
              >
                {{ port.value }}{{ port.copied() ? ' (' + t('connect.copied') + ')' : '' }}
              </button>
            </dd>
          </dl>
        </section>

        <p class="hint">{{ t('connect.clickToCopy') }}</p>
      </div>
    </app-minecraft-popup>
    <div class="spacer"></div>
  </div>
</div>
