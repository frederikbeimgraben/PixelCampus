<main class="main" *transloco="let t">
  <div class="bar">
    <span class="caption">{{ t('landing.title') }}</span>
    <app-language-switch class="language"></app-language-switch>
  </div>

  <div class="content">
    <div class="inner-content">
      @if (popupVisible()) {
        <app-info-popup></app-info-popup>
      } @else {
        <div class="navigator">
          <app-navigator (showPopup)="showPopup()"></app-navigator>
        </div>
      }
    </div>
    <div class="shadow"></div>
  </div>

  <div class="footer">
    @if (popupVisible()) {
      <app-minecraft-button class="button" [style.width.px]="200" (activated)="closePopup()">
        {{ t('common.back') }}
      </app-minecraft-button>
    } @else {
      <div class="footer-row">
        <app-minecraft-button class="button" [style.width.px]="200" [target]="contactUrl">
          {{ t('landing.contact') }}
        </app-minecraft-button>
        <app-minecraft-button class="button" [style.width.px]="200" [target]="privacyUrl">
          {{ t('landing.privacy') }}
        </app-minecraft-button>
      </div>
    }
  </div>
</main>
