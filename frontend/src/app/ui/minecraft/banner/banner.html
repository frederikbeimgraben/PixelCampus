<!--
  An entry that leads somewhere is an anchor, so the browser opens it: with the
  keyboard before the bundle has loaded, in a new tab on a middle click, and
  from the context menu. Angular's event replay covers a click made that early
  but not a key press, so a div listening for Enter simply lost it.

  The server entry has nowhere to link to -- it opens the connection details in
  place -- so it stays a button and keeps its own key handling.
-->
@if (routerLink(); as link) {
  <a
    class="container background-tint"
    [class.active]="active()"
    [routerLink]="link"
    [attr.aria-label]="label()"
    (mouseenter)="onEnter()"
    (mouseleave)="onLeave()"
    (click)="onSelect($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else if (href(); as url) {
  <a
    class="container background-tint"
    [class.active]="active()"
    [href]="url"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="label()"
    (mouseenter)="onEnter()"
    (mouseleave)="onLeave()"
    (click)="onSelect($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div
    class="container background-tint"
    role="button"
    tabindex="0"
    [class.active]="active()"
    [attr.aria-label]="label()"
    (mouseenter)="onEnter()"
    (mouseleave)="onLeave()"
    (click)="onSelect($event)"
    (keydown.enter)="onKeyActivate($event)"
    (keydown.space)="onKeyActivate($event)"
  >
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}

<ng-template #body>
  <div class="row">
    <app-minecraft-icon [iconUrl]="iconUrl()" [highlighted]="hovered() || active()" />

    <div class="text-column">
      <div class="server-name">{{ title() }}</div>

      @for (span of description(); track $index) {
        <span
          class="server-description-part"
          [style.color]="span.color"
          [style.fontFamily]="span.fontFamily"
        >
          {{ span.text }}
        </span>
        <br />
      }
    </div>

    <div class="right">
      <app-player-count
        [latency]="latency()"
        [playerCount]="playerCount()"
        [maxPlayerCount]="maxPlayerCount()"
        [players]="players()"
        class="player-count"
      ></app-player-count>

      @if (version() !== undefined) {
        <app-version-info [version]="version()" class="version-info"></app-version-info>
      }
    </div>
  </div>
</ng-template>
