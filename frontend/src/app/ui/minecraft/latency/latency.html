<app-minecraft-tooltip-wrapper [content]="tooltipLines()">
  @if (offline()) {
    <img src="/assets/ping/unreachable.png" class="ping" alt="Server unreachable" />
  } @else {
    <img
      [src]="'/assets/ping/ping_' + barIndex() + '.png'"
      class="ping"
      [alt]="'Latency ' + label()"
    />
  }
</app-minecraft-tooltip-wrapper>
