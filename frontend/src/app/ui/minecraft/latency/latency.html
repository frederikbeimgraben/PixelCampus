<app-minecraft-tooltip-wrapper [content]="tooltipLines()">
  @if (offline()) {
    <img src="/assets/ping/unreachable.png" class="ping" [alt]="unreachableAlt()" />
  } @else {
    <img [src]="'/assets/ping/ping_' + barIndex() + '.png'" class="ping" [alt]="latencyAlt()" />
  }
</app-minecraft-tooltip-wrapper>
