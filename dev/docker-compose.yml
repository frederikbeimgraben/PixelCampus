name: pixelcampus-dev

# A Minecraft server with the two plugins this API reads. It gives the API real
# upstreams, so the site can be tested against live data instead of fixtures.
#
# The game port is open to the network, because a player has to reach it. Both
# plugin ports stay on loopback. The ServerTap key also authorizes console
# commands, so that port must never leave this machine.

services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: pixelcampus-mc
    tty: true
    stdin_open: true
    restart: unless-stopped

    ports:
      - '25565:25565' # Java edition
      - '127.0.0.1:4567:4567' # ServerTap
      - '127.0.0.1:8804:8804' # PLAN

    environment:
      EULA: 'TRUE'
      TYPE: PAPER

      # ServerTap 0.6.1 is the newest release, and it dates from 2023. It is
      # built against the 1.20 API. Raise this only after you check that the
      # plugin still loads.
      VERSION: ${MC_VERSION:-1.20.4}

      MEMORY: 2G
      USE_AIKAR_FLAGS: 'true'

      # Match the host user, so the world files stay editable outside the
      # container.
      UID: 1000
      GID: 100

      MOTD: '§bPixel§fCampus §8» §7local test server'
      DIFFICULTY: normal
      MAX_PLAYERS: '20'
      VIEW_DISTANCE: '10'
      SPAWN_PROTECTION: '0'

      # Online mode keeps the real account UUIDs, which is what both plugins
      # key their records on. Set MC_ONLINE_MODE=FALSE to join with any name.
      ONLINE_MODE: ${MC_ONLINE_MODE:-TRUE}
      OPS: ${MC_OPS:-}

      # The same icon the site uses, so a server list ping returns something
      # recognizable.
      ICON: /icon.png
      OVERRIDE_ICON: 'TRUE'

      PLUGINS: |
        https://github.com/servertap-io/servertap/releases/download/v0.6.1/ServerTap-0.6.1.jar
        https://github.com/plan-player-analytics/Plan/releases/download/5.8.3579/Plan-5.8-build-3579.jar

    volumes:
      - ./data:/data
      - ../frontend/public/favicon.png:/icon.png:ro

    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 3m
      interval: 10s
      retries: 6
