name: pixelcampus-dev

# A Minecraft server with the plugin this API reads. It gives the API real
# upstreams, so the site can be tested against live data instead of fixtures.
#
# The game port is open to the network, because a player has to reach it, and
# the API also pings it for the server status. The PLAN port stays on loopback.

services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: pixelcampus-mc
    tty: true
    stdin_open: true
    restart: unless-stopped

    ports:
      - '25565:25565' # Java edition, and the server list ping the API reads
      - '127.0.0.1:8804:8804' # PLAN

    environment:
      EULA: 'TRUE'
      TYPE: PAPER

      # No plugin holds this back any more. ServerTap did: its newest release is
      # built against the 1.20 API. This default stays where the existing world
      # was made, because a newer server upgrades a world and cannot undo it.
      # Set MC_VERSION to move, and copy dev/data first.
      VERSION: ${MC_VERSION:-1.20.4}

      MEMORY: 2G
      USE_AIKAR_FLAGS: 'true'

      # Match the host user, so the world files stay editable outside the
      # container.
      UID: 1000
      GID: 100

      MOTD: '§bPixel§fCampus §8» §7local test server'
      DIFFICULTY: normal
      MAX_PLAYERS: '20'
      VIEW_DISTANCE: '10'
      SPAWN_PROTECTION: '0'

      # Online mode keeps the real account UUIDs, which is what both plugins
      # key their records on. Set MC_ONLINE_MODE=FALSE to join with any name.
      ONLINE_MODE: ${MC_ONLINE_MODE:-TRUE}
      OPS: ${MC_OPS:-}

      # The same icon the site uses, so a server list ping returns something
      # recognizable.
      ICON: /icon.png
      OVERRIDE_ICON: 'TRUE'

      PLUGINS: |
        https://github.com/plan-player-analytics/Plan/releases/download/5.8.3579/Plan-5.8-build-3579.jar

    volumes:
      - ./data:/data
      - ../frontend/public/favicon.png:/icon.png:ro

    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 3m
      interval: 10s
      retries: 6
