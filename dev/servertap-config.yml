# Template for plugins/ServerTap/config.yml.
#
# ServerTap writes this file on its first start and never reads it again from
# anywhere else. `up.sh` puts this copy in place before the plugin runs.
#
# The key is a local development key. It is in the repository on purpose, so
# the stack starts without a setup step. A real deployment keeps its key in an
# environment file outside the store. Read backend/README.md.

port: 4567

tls:
  enabled: false
  keystore: keystore.jks
  keystorePassword: ''
  sni: false

useKeyAuth: true
key: z1SMyu0wmBBZQeYY8BQpsXzcCUhui1

# The API is the only client, and it calls from the server side. No browser
# reaches this port.
corsOrigins:
  - 'http://127.0.0.1'

disable-swagger: false
blocked-paths: []
websocketConsoleBuffer: 1000
